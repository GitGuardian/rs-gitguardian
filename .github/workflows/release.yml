name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  ci:
    name: Test and lint
    uses: ./.github/workflows/test-lint.yml
    permissions:
      contents: read
    secrets:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  verify:
    name: Verify packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.pending.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - name: Check that the tag matches the package versions
        run: |
          metadata="$(cargo metadata --no-deps --format-version 1)"
          expected="${GITHUB_REF_NAME#v}"
          mismatched="$(jq -r --arg v "${expected}" \
            '.packages[] | select(.publish != [] and .version != $v) | "\(.name)@\(.version)"' <<< "${metadata}")"
          if [ -n "${mismatched}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match: ${mismatched}" >&2
            exit 1
          fi
          req="$(jq -r '.packages[] | select(.name == "gitguardian-client")
            | .dependencies[] | select(.name == "gitguardian-api") | .req' <<< "${metadata}")"
          if [ "${req}" != "=${expected}" ]; then
            echo "gitguardian-client requires gitguardian-api ${req}, expected =${expected}" >&2
            exit 1
          fi

      - name: Select packages not yet on crates.io
        id: pending
        run: |
          packages=()
          while read -r name version; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -A "rs-gitguardian release workflow (https://github.com/GitGuardian/rs-gitguardian)" \
              "https://crates.io/api/v1/crates/${name}/${version}")"
            case "${status}" in
              200) echo "${name}@${version} is already published, skipping" ;;
              404) packages+=("-p" "${name}") ;;
              *)
                echo "unexpected HTTP ${status} while checking ${name}@${version}" >&2
                exit 1
                ;;
            esac
          done < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | "\(.name) \(.version)"')
          echo "packages=${packages[*]}" >> "${GITHUB_OUTPUT}"

      - name: Verify packages
        if: steps.pending.outputs.packages != ''
        run: cargo publish --locked --dry-run ${PACKAGES}
        env:
          PACKAGES: ${{ steps.pending.outputs.packages }}

  publish:
    name: Publish to crates.io
    needs: [ci, verify]
    if: needs.verify.outputs.packages != ''
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      - name: Publish
        run: cargo publish --locked --no-verify ${PACKAGES}
        env:
          PACKAGES: ${{ needs.verify.outputs.packages }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
