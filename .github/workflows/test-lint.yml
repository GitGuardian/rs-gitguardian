name: Main

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      GITGUARDIAN_API_KEY:
        required: false
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo|${{ runner.os }}|${{ hashFiles('Cargo.lock') }}

      - name: Skip ggshield without an API key
        if: ${{ github.event.pull_request.head.repo.fork || env.GITGUARDIAN_API_KEY == '' }}
        run: echo "SKIP=ggshield" >> $GITHUB_ENV

      - uses: j178/prek-action@v3.0.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo|${{ runner.os }}|${{ hashFiles('Cargo.lock') }}

      - name: Test
        run: cargo test --workspace --all-features
