name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      GITGUARDIAN_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly
          components: rustfmt

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037
        with:
          tool: cargo-deny

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d
        env:
          SKIP: ${{ github.event.pull_request.head.repo.fork && 'ggshield' || '' }}

      - name: Check that public crates can be published
        run: cargo publish --workspace --dry-run --no-verify --locked

      - name: Check advisories, licenses and sources
        run: cargo deny --locked check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Clippy
        if: runner.os != 'Linux'
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked --no-fail-fast

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Check
        run: cargo +1.88 check --workspace --all-features --all-targets --locked

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Doc
        run: cargo doc --workspace --all-features --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings
